<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stock Watcher</title>
  <style>
    * { box-sizing: border-box; }
    body {
      width: 380px;
      min-height: 520px;
      margin: 0;
      color: #e8edf2;
      background: #11151c;
      font: 13px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }
    .popup { padding: 14px; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }
    h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
    }
    h2 {
      margin: 0 0 10px;
      color: #f4f7fb;
      font-size: 14px;
    }
    button {
      border: 1px solid #344154;
      border-radius: 7px;
      color: #e8edf2;
      background: #1b2430;
      font: inherit;
      cursor: pointer;
    }
    button:hover { background: #243044; }
    button.primary {
      border-color: #2a7d6f;
      background: #1f6f64;
    }
    button.danger {
      color: #ffb6b6;
      border-color: #613039;
      background: #2b161b;
    }
    .icon-btn {
      width: 30px;
      height: 30px;
      padding: 0;
    }
    .section {
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #273244;
      border-radius: 8px;
      background: #151b25;
    }
    .stock-list {
      max-height: 230px;
      overflow: auto;
      border: 1px solid #273244;
      border-radius: 7px;
      background: #10151d;
    }
    .stock-row {
      display: grid;
      grid-template-columns: 28px 64px 1fr 28px;
      gap: 6px;
      align-items: center;
      padding: 8px;
      border-bottom: 1px solid #222d3d;
    }
    .priority-btn {
      width: 24px; height: 24px; padding: 0; border-radius: 4px;
      border: 1px solid #344154; cursor: pointer; font-size: 10px;
      line-height: 22px; text-align: center; font-family: monospace;
    }
    .pri-position { background: #1f6f64; color: #7bd6c8; }
    .pri-key { background: #2a5f7d; color: #7bc8d6; }
    .pri-normal { background: #1b2430; color: #9ea9b8; }
    .pri-silent { background: #2b161b; color: #9c7b7b; }
    .stock-row:last-child { border-bottom: 0; }
    .code {
      color: #f4f7fb;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-weight: 700;
    }
    .name {
      min-width: 0;
      overflow: hidden;
      color: #9ea9b8;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    input[type="text"] {
      width: 100%;
      min-width: 0;
      height: 30px;
      padding: 5px 7px;
      border: 1px solid #344154;
      border-radius: 6px;
      color: #e8edf2;
      background: #0e131b;
      font: inherit;
    }
    input::placeholder { color: #667386; }
    .add-stock {
      display: grid;
      grid-template-columns: 1fr 68px;
      gap: 8px;
      margin-top: 10px;
    }
    .about {
      margin: 6px 0 0;
      color: #9ea9b8;
    }
    .status {
      min-height: 18px;
      color: #9ea9b8;
      font-size: 12px;
    }
    .error { color: #ff9c9c; }
    .ok { color: #7bd6c8; }
    .empty {
      padding: 14px;
      color: #9ea9b8;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="popup">
    <header>
      <h1>Stock Watcher</h1>
      <button class="icon-btn" id="refresh-btn" type="button" title="刷新">R</button>
    </header>

    <section class="section">
      <h2>自选股管理</h2>
      <div class="stock-list" id="stock-list"></div>
      <div class="add-stock">
        <input type="text" id="stock-input" placeholder="输入股票代码，如 600522" maxlength="6" inputmode="numeric">
        <button class="primary" id="add-btn" type="button">添加</button>
      </div>
    </section>

    <section class="section">
      <h2>操作说明</h2>
      <p class="about">Ctrl+H 显示/隐藏浮窗</p>
      <p class="about">按住 Alt 临时偷看，松手恢复隐藏</p>
      <p class="about">鼠标悬停底部细线弹出紧凑视图</p>
      <p class="about">点击细线弹出完整表格</p>
      <p class="about">浮窗可拖拽标题栏移动位置</p>
    </section>

    <div class="status" id="status"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
